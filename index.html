    // --- MATCHING ALGORITHM ---
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildPairFrequencyMap(history) {
      const map = new Map();
      for (const rec of history) {
        for (const g of rec.groups) {
          const members = g.members;
          for (let i = 0; i < members.length; i++) {
            for (let j = i + 1; j < members.length; j++) {
              const pairKey = [members[i].id, members[j].id].sort().join('::');
              map.set(pairKey, (map.get(pairKey) || 0) + 1);
            }
          }
        }
      }
      return map;
    }

    function evaluatePartitionScore(partition, freqMap, config) {
      let score = 0;

      // 1. Historical Overlap & Avoid-With Evaluation
      for (const group of partition) {
        for (let i = 0; i < group.length; i++) {
          for (let j = i + 1; j < group.length; j++) {
            const s1 = group[i];
            const s2 = group[j];

            if (config.minimizeOverlap) {
              const pairKey = [s1.id, s2.id].sort().join('::');
              const count = freqMap.get(pairKey) || 0;
              score += count * 1000;
            }

            if (s1.avoidWithIds && s1.avoidWithIds.includes(s2.id)) score += 10000;
            if (s2.avoidWithIds && s2.avoidWithIds.includes(s1.id)) score += 10000;
          }
        }
      }

      // 2. Trait Balance Evaluation
      if (config.considerTraits) {
        for (const group of partition) {
          let learningSupportCount = 0;
          let specialSupportCount = 0;
          let quietIsolatedCount = 0;
          let popularCount = 0;
          let leaderHelperCount = 0;

          for (const s of group) {
            if (s.trait === 'learning_support') learningSupportCount++;
            if (s.trait === 'special_support') specialSupportCount++;
            if (s.trait === 'quiet_isolated') quietIsolatedCount++;
            if (s.trait === 'popular') popularCount++;
            if (s.trait === 'leader_helper') leaderHelperCount++;
          }

          const totalNeedingCare = learningSupportCount + specialSupportCount;
          if (totalNeedingCare >= 2) score += (totalNeedingCare - 1) * 500;

          if (totalNeedingCare > 0) {
            if (leaderHelperCount > 0) score -= 300;
            else if (popularCount > 0) score -= 200;
            else score += 250;
          }

          if (quietIsolatedCount > 0) {
            if (popularCount > 0 || leaderHelperCount > 0) score -= 200;
            if (quietIsolatedCount >= 2 && group.length <= 3) score += 200;
          }

          if (leaderHelperCount >= 2) score += (leaderHelperCount - 1) * 350;
        }
      }

      return score;
    }

    function generateGroups(activeStudents, config, history) {
      if (activeStudents.length === 0) return [];

      const freqMap = buildPairFrequencyMap(history);
      const needOpt = config.minimizeOverlap || config.considerTraits;
      const TRIALS = needOpt ? 800 : 1;

      let bestPartition = null;
      let bestScore = Infinity;

      for (let i = 0; i < TRIALS; i++) {
        const shuffled = shuffleArray(activeStudents);
        let partition = [];

        if (config.type === 'pair') {
          for (let k = 0; k < shuffled.length; k += 2) {
            if (k + 1 < shuffled.length) partition.push([shuffled[k], shuffled[k + 1]]);
            else {
              if (partition.length > 0 && config.leftoverOption === 'merge') {
                partition[partition.length - 1].push(shuffled[k]);
              } else {
                partition.push([shuffled[k]]);
              }
            }
          }
        } else {
          if (config.mode === 'by_size') {
            const targetSize = Math.max(2, config.groupSize);
            const total = shuffled.length;
            const fullGroupCount = Math.floor(total / targetSize);
            const remainder = total % targetSize;

            if (fullGroupCount === 0) {
              partition.push([...shuffled]);
            } else {
              let ptr = 0;
              for (let g = 0; g < fullGroupCount; g++) {
                partition.push(shuffled.slice(ptr, ptr + targetSize));
                ptr += targetSize;
              }
              if (remainder > 0) {
                const leftovers = shuffled.slice(ptr);
                if (config.leftoverOption === 'merge') {
                  for (let r = 0; r < leftovers.length; r++) {
                    partition[r % partition.length].push(leftovers[r]);
                  }
                } else {
                  partition.push(leftovers);
                }
              }
            }
          } else {
            const numGroups = Math.max(1, Math.min(config.targetCount, shuffled.length));
            partition = Array.from({ length: numGroups }, () => []);
            shuffled.forEach((student, idx) => {
              partition[idx % numGroups].push(student);
            });
          }
        }

        const score = evaluatePartitionScore(partition, freqMap, config);
        if (score < bestScore) {
          bestScore = score;
          bestPartition = partition;
        }
      }

      return (bestPartition || []).map((members, idx) => ({
        id: `group-${Date.now()}-${idx}`,
        name: config.type === 'pair' ? `짝 ${idx + 1}` : `${idx + 1}모둠`,
        members,
      }));
    }

    // --- GEMINI API CALL (PURE BROWSER FETCH) ---
    async function generateClassroomAdviceWithGemini(apiKey, groups, config) {
      if (!apiKey || !apiKey.trim()) {
        throw new Error('AI 키가 등록되어 있지 않습니다. AI 키를 먼저 설정해 주세요.');
      }

      const traitNames = {
        learning_support: '학습지원 필요', special_support: '도움반/배려 필요',
        quiet_isolated: '소극적/소외 우려', popular: '인기/친화력 높음',
        leader_helper: '리더/또래도우미', none: '일반'
      };

      const groupSummaries = groups.map((g, idx) => {
        const memberDetails = g.members.map(m => `${m.name}${m.trait && m.trait !== 'none' ? ` (${traitNames[m.trait]})` : ''}`).join(', ');
        return `${g.name || `${idx + 1}조`}: ${memberDetails}`;
      });

      const prompt = `
당신은 초등/중등 학급 경영 및 생활지도에 통달한 따뜻하고 유능한 베테랑 교사입니다.
선생님이 방금 구성한 학생 자릿수/모둠 배치 결과를 바탕으로, 학급 운영 및 수업활동 시 도움이 될 **AI 학급지도 총평 및 모둠별 코칭 팁**을 작성해 주세요.

[현재 구성된 배치 현황]
- 총 모둠 수: ${groups.length}개
- 형태: ${config.type === 'pair' ? '2인 짝꿍' : '소모둠'}
- 모둠 명단 및 학생 특성:
${groupSummaries.map(g => `- ${g}`).join('\n')}

[작성 가이드라인]
1. **학급 전체 배치 총평 (1~2문장)**
2. **모둠별 맞춤 생활지도 & 수업 팁 (bullet points)**
3. **선생님을 위한 응원의 한마디 (1문장)**

답변은 마크다운 형식으로 가독성 있고 정갈하게 작성해 주세요.
`;

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey.trim())}`;

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: prompt }] }],
          systemInstruction: { parts: [{ text: '초등학교 및 중학교 교사를 돕는 전문 교육 상담가로서 친절하고 명확하며 실용적인 조언을 제공합니다.' }] }
        })
      });

      if (!res.ok) {
        const errJson = await res.json().catch(() => ({}));
        throw new Error(errJson.error?.message || `API 요청 실패 (코드 ${res.status})`);
      }

      const data = await res.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || 'AI 분석 결과를 생성하지 못했습니다.';

                  const traitInfo = member.trait && member.trait !== 'none' ? traitBadges[member.trait] : null;
                  return (
                    <div key={member.id} onClick={() => onSelectStudentForSwap(member)} className={`px-3 py-2 rounded-2xl border cursor-pointer flex items-center gap-1.5 text-xs font-extrabold ${isSelected ? 'bg-amber-100 border-amber-400 text-amber-900 ring-2 ring-amber-400' : 'bg-slate-50 hover:bg-purple-50 border-slate-200 text-slate-800'}`}>

    // 5. AiAnalysisSection
    const AiAnalysisSection = ({ groups, config, onOpenApiKeyModal }) => {
      const [adviceText, setAdviceText] = useState(null);
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState(null);
      const [noKeyWarning, setNoKeyWarning] = useState(false);

      const handleGenerateAiAdvice = async () => {
        const apiKey = getStoredApiKey();
        if (!apiKey) {
          setNoKeyWarning(true);
          setErrorMsg(null);
          return;
        }

        setNoKeyWarning(false);
        setErrorMsg(null);
        setLoading(true);

        try {
          const res = await generateClassroomAdviceWithGemini(apiKey, groups, config);
          setAdviceText(res);
        } catch (err) {
          setErrorMsg(err.message || 'AI 분석 도중 오류가 발생했습니다.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="bg-gradient-to-br from-indigo-900 via-indigo-950 to-purple-950 rounded-3xl p-5 sm:p-6 text-white shadow-xl space-y-4 border border-indigo-700/50">

    // 6. ResultDisplay
    const ResultDisplay = ({ groups, excludedStudents, isPair, onReshuffle, onSaveToHistory, onOpenExportShare, onUpdateGroups, onOpenApiKeyModal }) => {
      const [revealedGroupIds, setRevealedGroupIds] = useState(new Set(groups.map(g => g.id)));
      const [swapSelection, setSwapSelection] = useState(null);
      const [savedSuccess, setSavedSuccess] = useState(false);

      const allRevealed = revealedGroupIds.size === groups.length;

      const handleToggleRevealAll = () => {
        if (allRevealed) {
          setRevealedGroupIds(new Set());
        } else {
          setRevealedGroupIds(new Set(groups.map(g => g.id)));
          if (window.confetti) window.confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
        }
      };

      const handleSelectStudentForSwap = (student, groupId) => {
        if (!swapSelection) {
          setSwapSelection({ student, groupId });
        } else if (swapSelection.student.id === student.id) {
          setSwapSelection(null);
        } else {
          const g1Id = swapSelection.groupId;
          const g2Id = groupId;
          const s1 = swapSelection.student;
          const s2 = student;

          const nextGroups = groups.map(g => {
            if (g.id === g1Id && g.id === g2Id) return g;
            if (g.id === g1Id) return { ...g, members: g.members.map(m => m.id === s1.id ? s2 : m) };
            if (g.id === g2Id) return { ...g, members: g.members.map(m => m.id === s2.id ? s1 : m) };
            return g;
          });

          onUpdateGroups(nextGroups);
          setSwapSelection(null);
        }
      };

        onSaveToHistory();
        setSavedSuccess(true);
        setTimeout(() => setSavedSuccess(false), 2000);

              <div>
                <span className="text-emerald-900 font-extrabold">선생님 전용 성향 배치 배려 완료:</span>
                <span className="ml-1 text-slate-700 font-medium">학습지원/도움반 학생과 또래도우미/친화력 높은 친구가 최적의 짝으로 구성되었습니다.</span>
              </div>
            </div>
            <span className="text-[10px] px-2 py-0.5 rounded-md bg-emerald-600 text-white font-extrabold shrink-0">자동 가중치 알고리즘</span>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {groups.map((group, idx) => (
              <ResultCard
                key={group.id}
                group={group}
                index={idx}
                isPair={isPair}
                isRevealed={revealedGroupIds.has(group.id)}
                selectedSwapStudentId={swapSelection?.student.id || null}
                onReveal={() => {
                  const next = new Set(revealedGroupIds);
                  next.add(group.id);
                  setRevealedGroupIds(next);
                }}
                onRename={(newName) => {
                  onUpdateGroups(groups.map(g => g.id === group.id ? { ...g, name: newName } : g));
                }}
                onSelectStudentForSwap={(s) => handleSelectStudentForSwap(s, group.id)}
              />
            ))}
          </div>

          {excludedStudents.length > 0 && (
            <div className="p-4 bg-amber-50 rounded-2xl border border-amber-200 text-xs text-amber-900 flex items-start gap-2.5">
              <Icons.UserX className="w-4 h-4 text-amber-600 shrink-0 mt-0.5" />
              <div>
                <span className="font-bold">오늘 결석/매칭 제외 학생 ({excludedStudents.length}명):</span>{' '}
                {excludedStudents.map(s => s.name).join(', ')}
              </div>
            </div>
          )}

          <AiAnalysisSection groups={groups} config={{ type: isPair ? 'pair' : 'group' }} onOpenApiKeyModal={onOpenApiKeyModal} />

          <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-3 border-t border-slate-100 no-print">
            <button onClick={onReshuffle} className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-xs flex items-center gap-1.5">
              <Icons.RefreshCw className="w-4 h-4 text-slate-600" /> 다시 재배치하기
            </button>
            <div className="flex items-center gap-2">
              <button onClick={handleSave} className={`px-4 py-2.5 font-bold rounded-2xl text-xs flex items-center gap-1.5 transition-all ${savedSuccess ? 'bg-emerald-600 text-white' : 'bg-indigo-600 text-white'}`}>
                <Icons.BookmarkPlus className="w-4 h-4" /> {savedSuccess ? '저장 완료!' : '이번 결과 기록 저장'}
              </button>
              <button onClick={onOpenExportShare} className="px-4 py-2.5 bg-purple-600 text-white font-bold rounded-2xl text-xs flex items-center gap-1.5">
                <Icons.Share2 className="w-4 h-4" /> 결과 공유/출력
              </button>
            </div>
          </div>
        </section>
      );
    };

    // 7. HistoryModal
    const HistoryModal = ({ isOpen, onClose, records, onClearHistory, onDeleteRecord }) => {
      if (!isOpen) return null;

      const formatDate = (ts) => {
        const d = new Date(ts);
        return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 max-w-2xl w-full shadow-2xl space-y-4 border border-slate-100 max-h-[85vh] flex flex-col">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100 shrink-0">
              <div className="flex items-center gap-2">
                <Icons.History className="w-5 h-5 text-indigo-600" />
                <h3 className="text-base font-extrabold text-slate-800">이전 모둠/자릿수 매칭 히스토리</h3>
                <span className="text-xs px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 font-bold">총 {records.length}건</span>
              </div>
              <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-slate-600 rounded-xl"><Icons.X className="w-5 h-5"/></button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-3 pr-1 scrollbar-thin">
              {records.length === 0 ? (
                <div className="text-center py-12 text-slate-400 text-xs">저장된 히스토리가 없습니다.</div>
              ) : (
                records.map((rec) => (
                  <div key={rec.id} className="p-4 bg-slate-50 rounded-2xl border border-slate-200/80 space-y-2">
                    <div className="flex items-center justify-between text-xs font-bold text-slate-700">
                      <span>{rec.title}</span>
                      <div className="flex items-center gap-2">
                        <span className="text-slate-400 font-normal">{formatDate(rec.createdAt)}</span>
                        <button onClick={() => onDeleteRecord(rec.id)} className="text-rose-500 hover:text-rose-700"><Icons.Trash2 className="w-4 h-4"/></button>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5 text-xs text-slate-600">
                      {rec.groups.map(g => (
                        <div key={g.id} className="p-2 bg-white rounded-xl border border-slate-100">
                          <span className="font-bold text-indigo-900">{g.name}:</span> {g.members.map(m => m.name).join(', ')}
                        </div>
                      ))}
                    </div>
                  </div>
                ))
              )}
            </div>

            <div className="flex justify-between items-center pt-3 border-t border-slate-100 shrink-0">
              <button onClick={onClearHistory} disabled={records.length === 0} className="px-3 py-2 bg-rose-50 text-rose-700 font-bold text-xs rounded-xl border border-rose-200">
                기록 전체 삭제
              </button>
              <button onClick={onClose} className="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl">닫기</button>
            </div>
          </div>
        </div>
      );
    };

    // 8. ExportShareModal
    const ExportShareModal = ({ isOpen, onClose, groups, excludedStudents }) => {
      const [copied, setCopied] = useState(false);

      if (!isOpen) return null;

      const generateTextSummary = () => {
        const dateStr = new Date().toLocaleDateString('ko-KR');
        let text = `[학급 자리 & 모둠 배치 결과 - ${dateStr}]\n\n`;
        groups.forEach((g) => {
          text += `📌 ${g.name}: ${g.members.map(m => m.name).join(', ')}\n`;
        });
        if (excludedStudents.length > 0) {
          text += `\n🚫 결석/제외 학생: ${excludedStudents.map(s => s.name).join(', ')}\n`;
        }
        return text;
      };

      const handleCopyText = () => {
        navigator.clipboard.writeText(generateTextSummary());
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4 border border-slate-100">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <div className="flex items-center gap-2">
                <Icons.Share2 className="w-5 h-5 text-purple-600" />
                <h3 className="text-base font-extrabold text-slate-800">배치 결과 공유 &amp; 인쇄</h3>
              </div>
              <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-slate-600 rounded-xl"><Icons.X className="w-5 h-5"/></button>
            </div>

            <div className="space-y-2">
              <button onClick={handleCopyText} className="w-full p-3 bg-purple-50 hover:bg-purple-100 text-purple-950 font-bold text-xs rounded-2xl border border-purple-200 flex items-center justify-center gap-2">
                <Icons.Copy className="w-4 h-4 text-purple-600"/>
                <span>{copied ? '텍스트 복사 완료!' : '클래스팅/알림장용 텍스트 복사'}</span>
              </button>

              <button onClick={() => window.print()} className="w-full p-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-950 font-bold text-xs rounded-2xl border border-indigo-200 flex items-center justify-center gap-2">
                <Icons.Printer className="w-4 h-4 text-indigo-600"/>
                <span>배치표 인쇄 / PDF 저장하기</span>
              </button>
            </div>

            <div className="p-3 bg-slate-50 border rounded-2xl">
              <span className="text-[11px] font-bold text-slate-500">복사 미리보기:</span>
              <pre className="text-[11px] font-mono text-slate-700 whitespace-pre-wrap mt-1 max-h-40 overflow-y-auto scrollbar-thin">
                {generateTextSummary()}
              </pre>
            </div>

            <div className="flex justify-end pt-2">
              <button onClick={onClose} className="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl">닫기</button>
            </div>
          </div>
        </div>
      );
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [students, setStudents] = useState([]);
      const [history, setHistory] = useState([]);
      const [config, setConfig] = useState({
        type: 'group', groupSize: 4, mode: 'by_size', targetCount: 3, leftoverOption: 'merge', minimizeOverlap: true, considerTraits: true
      });

      const [showHistory, setShowHistory] = useState(false);
      const [showExportShare, setShowExportShare] = useState(false);
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);
      const [hasApiKey, setHasApiKey] = useState(false);

      const [activeTab, setActiveTab] = useState('manage');
      const [currentGroups, setCurrentGroups] = useState([]);

      useEffect(() => {
        setStudents(getStoredStudents());
        setHistory(getStoredHistory());
        setConfig(getStoredConfig());
        setHasApiKey(Boolean(getStoredApiKey()));
      }, []);

      const updateStudents = (newStudents) => {
        setStudents(newStudents);
        saveStudents(newStudents);
      };

      const updateHistory = (newHistory) => {
        setHistory(newHistory);
        saveHistory(newHistory);
      };

      const handleUpdateConfig = (newConfig) => {
        setConfig(newConfig);
        saveConfig(newConfig);
      };

      const handleAddStudent = (name, trait) => {
        const newStudent = {
          id: `std-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
          name, trait: trait || 'none', isExcluded: false, createdAt: Date.now()
        };
        updateStudents([...students, newStudent]);
      };

      const handleBulkAdd = (names) => {
        const newStudents = names.map((name, idx) => ({
          id: `std-${Date.now()}-${idx}-${Math.random().toString(36).substr(2, 4)}`,
          name, trait: 'none', isExcluded: false, createdAt: Date.now() + idx
        }));
        updateStudents([...students, ...newStudents]);
      };

      const handleUpdateStudent = (id, name, trait, avoidWithIds) => {
        const updated = students.map(s => s.id === id ? { ...s, name, trait: trait || s.trait || 'none', avoidWithIds } : s);
        updateStudents(updated);
      };

      const handleDeleteStudent = (id) => {
        updateStudents(students.filter(s => s.id !== id));
      };

      const handleToggleExclude = (id) => {
        updateStudents(students.map(s => s.id === id ? { ...s, isExcluded: !s.isExcluded } : s));
      };

      const handleSetAllExcluded = (excluded) => {
        updateStudents(students.map(s => ({ ...s, isExcluded: excluded })));
      };

      const activeStudents = useMemo(() => students.filter(s => !s.isExcluded), [students]);
      const excludedStudents = useMemo(() => students.filter(s => s.isExcluded), [students]);

      const handleGenerate = () => {
        if (activeStudents.length === 0) return;
        const generated = generateGroups(activeStudents, config, history);
        setCurrentGroups(generated);
        setActiveTab('result');
      };

      const handleSaveToHistory = () => {
        if (currentGroups.length === 0) return;
        const dateStr = new Date().toLocaleDateString('ko-KR');
        const newRecord = {
          id: `hist-${Date.now()}`,
          title: `${config.type === 'pair' ? '2인 짝' : '소모둠'} 매칭 (${dateStr})`,
          createdAt: Date.now(),
          groups: currentGroups,
          config,
        };
        updateHistory([newRecord, ...history]);
      };

      const handleResetAll = () => {
        if (confirm('모든 데이터(학생 명단, 배치 히스토리)를 초기 상태로 리셋하시겠습니까?')) {
          updateStudents(DEFAULT_STUDENTS);
          updateHistory([]);
          setCurrentGroups([]);
          setActiveTab('manage');
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-16">
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs no-print">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-md">
                  <Icons.GraduationCap className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="text-base font-black text-slate-900 flex items-center gap-1.5">
                    학급 자리 &amp; 모둠 스마트 배치기
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200 font-extrabold">v2.0</span>
                  </h1>
                  <p className="text-[11px] text-slate-500 font-medium hidden sm:block">학생 성향 고려 · 누적 중복 방지 · 온디바이스 스마트 매칭</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setShowApiKeyModal(true)}
                  className={`flex items-center gap-1.5 px-3 py-2 font-bold rounded-2xl text-xs transition-all ${
                    hasApiKey ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-amber-400 text-indigo-950 font-black'
                  }`}
                >
                  <Icons.Key className={`w-4 h-4 ${hasApiKey ? 'text-emerald-600' : 'text-indigo-950'}`} />
                  <span>{hasApiKey ? 'AI 키 설정됨' : 'AI 키 설정'}</span>
                </button>

                <button onClick={() => setShowHistory(true)} className="flex items-center gap-1.5 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-xs">
                  <Icons.History className="w-4 h-4 text-indigo-600" />
                  <span>이전 기록 ({history.length})</span>
                </button>

                <button onClick={() => setShowExportShare(true)} className="flex items-center gap-1.5 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-xs">
                  <Icons.Share2 className="w-4 h-4 text-purple-600" />
                  <span className="hidden sm:inline">내보내기 / 공유</span>
                </button>

                <button onClick={handleResetAll} className="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-2xl" title="초기화">
                  <Icons.RotateCcw className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 pt-6 space-y-6">
            <nav className="flex items-center gap-2 p-1 bg-slate-200/80 rounded-2xl no-print max-w-md mx-auto">
              <button
                onClick={() => setActiveTab('manage')}
                className={`flex-1 py-2.5 rounded-xl font-extrabold text-xs flex items-center justify-center gap-1.5 transition-all ${
                  activeTab === 'manage' ? 'bg-white text-indigo-950 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                <Icons.Users className="w-4 h-4" />
                <span>1. 학생 명단 및 성향 관리</span>
              </button>

              <button
                onClick={() => { if (currentGroups.length > 0) setActiveTab('result'); else handleGenerate(); }}
                className={`flex-1 py-2.5 rounded-xl font-extrabold text-xs flex items-center justify-center gap-1.5 transition-all ${
                  activeTab === 'result' ? 'bg-white text-indigo-950 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                <Icons.Sparkles className="w-4 h-4" />
                <span>2. 배치 실행 및 결과 확인 ({currentGroups.length > 0 ? '완료' : '대기'})</span>
              </button>
            </nav>

            <div className="space-y-6">
              {activeTab === 'manage' && (
                <div className="space-y-6">
                  <StudentManager
                    students={students}
                    onAddStudent={handleAddStudent}
                    onBulkAdd={handleBulkAdd}
                    onUpdateStudent={handleUpdateStudent}
                    onDeleteStudent={handleDeleteStudent}
                    onToggleExclude={handleToggleExclude}
                    onSetAllExcluded={handleSetAllExcluded}
                  />

                  <MatchingControls
                    config={config}
                    onChangeConfig={handleUpdateConfig}
                    activeCount={activeStudents.length}
                    onGenerate={handleGenerate}
                  />
                </div>
              )}

              {activeTab === 'result' && (
                <ResultDisplay
                  groups={currentGroups}
                  excludedStudents={excludedStudents}
                  isPair={config.type === 'pair'}
                  onReshuffle={handleGenerate}
                  onSaveToHistory={handleSaveToHistory}
                  onOpenExportShare={() => setShowExportShare(true)}
                  onUpdateGroups={setCurrentGroups}
                  onOpenApiKeyModal={() => setShowApiKeyModal(true)}
                />
              )}
            </div>
          </main>

          <HistoryModal
            isOpen={showHistory}
            onClose={() => setShowHistory(false)}
            records={history}
            onClearHistory={() => updateHistory([])}
            onDeleteRecord={(id) => updateHistory(history.filter(h => h.id !== id))}
          />

          <ExportShareModal
            isOpen={showExportShare}
            onClose={() => setShowExportShare(false)}
            groups={currentGroups}
            excludedStudents={excludedStudents}
          />

          <ApiKeyModal
            isOpen={showApiKeyModal}
            onClose={() => setShowApiKeyModal(false)}
            onKeyChange={() => setHasApiKey(Boolean(getStoredApiKey()))}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
